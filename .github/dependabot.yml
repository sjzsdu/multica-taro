version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Keep the queue small: at most 3 npm PRs at a time.
    open-pull-requests-limit: 3
    groups:
      taro:
        patterns:
          - '@tarojs/*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
    ignore:
      # Major upgrades need a dedicated migration. Left in the weekly queue
      # they just produce PRs that cannot be merged safely (React 19 against
      # Taro 4.3, TypeScript 7, Babel 8, webpack major).
      - dependency-name: react
        update-types: ['version-update:semver-major']
      - dependency-name: react-dom
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: webpack
        update-types: ['version-update:semver-major']
      - dependency-name: '@babel/runtime'
        update-types: ['version-update:semver-major']
      - dependency-name: '@babel/preset-env'
        update-types: ['version-update:semver-major']
      - dependency-name: '@babel/preset-react'
        update-types: ['version-update:semver-major']
      - dependency-name: '@babel/preset-typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # All Actions bumps land in one grouped PR instead of one PR per action.
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - '*'
