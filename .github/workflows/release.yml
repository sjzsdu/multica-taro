name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [h5, weapp]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build:${{ matrix.target }}

      # The H5 zip is a plain static bundle. The WeChat zip keeps the repo
      # layout (project.config.json + dist/) because miniprogramRoot points at
      # dist/; flattening it would break the DevTools project.
      - name: Package
        run: |
          if [ "${{ matrix.target }}" = "weapp" ]; then
            zip -r "multica-taro-weapp-${GITHUB_REF_NAME}.zip" project.config.json dist
          else
            cd dist
            zip -r "../multica-taro-h5-${GITHUB_REF_NAME}.zip" .
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: multica-taro-${{ matrix.target }}-*.zip
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
